[package]
name = "dfu-walk"
version = "0.1.0"
edition = "2021"
description = "Terreno e citta' percorribili di Daggerfall in Bevy con texture originali"
license = "MIT"
default-run = "dfu-walk"

[lib]
name = "daggerfall_data"
path = "src/data/mod.rs"

[[bin]]
name = "dfu-walk"
path = "src/main.rs"


[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "bevy_ui",
    "default_font",
    "multi_threaded",
    "x11",
    "tonemapping_luts",
    "bevy_audio",   # <-- aggiungi
    "vorbis",
    "wav",
] }
dfmod = { version = "0.1.0", path = "../dfmod" }
image = { version = "0.25", default-features = false, features = ["png"] }
texture2ddecoder = "0.1"
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
