# Voci parlate dei PNG con Kokoro TTS. Modificalo e riavvia il gioco.
# enabled=false disattiva le voci (nessun thread, nessuna richiesta).
enabled=true

# Server Kokoro (api_server.py). Avvialo a parte.
host=127.0.0.1
port=8880
path=/v1/audio/speech
model=kokoro
# wav (consigliato) oppure pcm (s16 mono grezzo a sample_rate)
response_format=wav
sample_rate=24000
volume=1
timeout_secs=120
# Cache dei WAV gia' sintetizzati
cache_dir=voice_audio

# Voci per genere (separate da virgola). Ogni PNG ne ha sempre la stessa.
voices_female=af_bella,af_nicole,af_sarah,af_sky,af_nova,af_jessica,af_heart
voices_male=am_adam,am_michael,am_fenrir,am_puck,am_eric,am_liam,am_onyx
# Voci dei nobili (Kokoro ha voci britanniche)
voices_noble_female=bf_emma,bf_isabella,bf_alice,bf_lily
voices_noble_male=bm_george,bm_lewis,bm_daniel,bm_fable
